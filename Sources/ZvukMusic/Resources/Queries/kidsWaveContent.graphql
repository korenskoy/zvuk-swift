# Извлечено из web-клиента zvuk.com v8.6.2
query kidsWaveContent($contentInput: KidsWaveContentInput, $waveSrc: WaveSource) {
  kidsWaveContent(contentInput: $contentInput, waveSrc: $waveSrc) {
    ...PlayerTrackData
  }
}

fragment PlayerTrackData on Track {
  id
  title
  lyrics
  hasFlac
  duration
  explicit
  availability
  artistTemplate
  childParam
  mark
  artists {
    id
    title
    image {
      src
      palette
    }
    mark
  }
  release {
    id
    title
    image {
      src
      palette
    }
  }
  zchan
  __typename
}
