# Извлечено из web-клиента zvuk.com v8.6.2
query getChaptersById($ids: [ID!]!) {
  getChapters(ids: $ids) {
    ...PlayerChapterData
  }
}

fragment PlayerChapterData on Chapter {
  id
  title
  availability
  duration
  childParamV2
  image {
    src
  }
  book {
    id
    title
    mark
    explicit
  }
  bookAuthors {
    id
    rname
    image {
      src
    }
  }
  position
  __typename
}
