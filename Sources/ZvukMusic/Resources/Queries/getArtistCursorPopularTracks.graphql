# Извлечено из web-клиента zvuk.com v8.6.2
query getArtistCursorPopularTracks($ids: [ID!]!, $limit: Int!, $cursor: String, $withPreview: Boolean = false) {
  getArtists(ids: $ids) {
    title
    getCursorPopularTracks(cursor: $cursor, limit: $limit) {
      pageInfo: page_info {
        hasNextPage
        endCursor
      }
      tracks {
        ...PlayerTrackData
        release @include(if: $withPreview) {
          date
        }
        stream @include(if: $withPreview) {
          preview
        }
      }
    }
  }
}

fragment PlayerTrackData on Track {
  id
  title
  lyrics
  hasFlac
  duration
  explicit
  availability
  artistTemplate
  childParam
  mark
  artists {
    id
    title
    image {
      src
      palette
    }
    mark
  }
  release {
    id
    title
    image {
      src
      palette
    }
  }
  zchan
  __typename
}
