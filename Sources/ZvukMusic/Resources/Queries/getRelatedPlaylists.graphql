# Извлечено из web-клиента zvuk.com v8.6.2
query getRelatedPlaylists($id: ID!, $limit: Int = 30) {
  relatedPlaylists(playlist_id: $id, limit: $limit) {
    id
    title
    duration
    profile {
      id
      name
    }
    hashtags {
      id
      name
    }
    childParam
    trackCount
    tracks(limit: 5, offset: 0) {
      ...PlayerTrackData
    }
  }
}

fragment PlayerTrackData on Track {
  id
  title
  lyrics
  hasFlac
  duration
  explicit
  availability
  artistTemplate
  childParam
  mark
  artists {
    id
    title
    image {
      src
      palette
    }
    mark
  }
  release {
    id
    title
    image {
      src
      palette
    }
  }
  zchan
  __typename
}
