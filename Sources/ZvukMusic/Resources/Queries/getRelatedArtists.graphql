# Извлечено из web-клиента zvuk.com v8.6.2
query getRelatedArtists($id: ID!, $limitArtists: PositiveInt!, $withPopularTrackArtist: Boolean! = true, $limitPopularTracks: Int!) {
  getArtists(ids: [$id]) {
    id
    title
    image {
      src
      palette
    }
    popularTracks(limit: $limitPopularTracks) @include(if: $withPopularTrackArtist) {
      ...PlayerTrackData
    }
    mark
  }
  relatedArtists(artist_id: $id, limit: $limitArtists) {
    id
    title
    image {
      src
      palette
    }
    popularTracks(limit: $limitPopularTracks) @include(if: $withPopularTrackArtist) {
      ...PlayerTrackData
    }
    mark
  }
}

fragment PlayerTrackData on Track {
  id
  title
  lyrics
  hasFlac
  duration
  explicit
  availability
  artistTemplate
  childParam
  mark
  artists {
    id
    title
    image {
      src
      palette
    }
    mark
  }
  release {
    id
    title
    image {
      src
      palette
    }
  }
  zchan
  __typename
}
