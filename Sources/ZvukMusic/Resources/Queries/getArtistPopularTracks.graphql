# Извлечено из web-клиента zvuk.com v8.6.2
query getArtistPopularTracks($ids: [ID!]!, $limit: Int!, $offset: Int!) {
  getArtists(ids: $ids) {
    title
    popularTracks(limit: $limit, offset: $offset) {
      ...PlayerTrackData
    }
  }
}

fragment PlayerTrackData on Track {
  id
  title
  lyrics
  hasFlac
  duration
  explicit
  availability
  artistTemplate
  childParam
  mark
  artists {
    id
    title
    image {
      src
      palette
    }
    mark
  }
  release {
    id
    title
    image {
      src
      palette
    }
  }
  zchan
  __typename
}
