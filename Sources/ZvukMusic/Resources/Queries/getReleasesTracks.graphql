# Извлечено из web-клиента zvuk.com v8.6.2
query getReleasesTracks($ids: [ID!]!) {
  getReleases(ids: $ids) {
    title
    type
    tracks {
      ...PlayerTrackData
    }
  }
}

fragment PlayerTrackData on Track {
  id
  title
  lyrics
  hasFlac
  duration
  explicit
  availability
  artistTemplate
  childParam
  mark
  artists {
    id
    title
    image {
      src
      palette
    }
    mark
  }
  release {
    id
    title
    image {
      src
      palette
    }
  }
  zchan
  __typename
}
