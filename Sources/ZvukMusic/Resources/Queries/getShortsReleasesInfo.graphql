# Извлечено из web-клиента zvuk.com v8.6.2
query getShortsReleasesInfo($ids: [ID!]!, $withArtists: Boolean! = false) {
  getReleases(ids: $ids) {
    id
    title
    type
    mediaContentCount
    explicit
    mark
    image {
      src
      palette
    }
    artists @include(if: $withArtists) {
      id
      title
    }
    __typename
  }
}
